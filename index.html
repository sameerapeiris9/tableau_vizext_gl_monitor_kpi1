<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KPI Chart Card</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --font:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.22,.68,0,1.1);
  --ease2:cubic-bezier(.16,1,.3,1);
  --t1:#0f172a;
  --t2:#334155;
  --t3:#64748b;
  --t4:#94a3b8;
  --t5:#cbd5e1;
}

html,body{
  width:100%;height:100%;
  background:#F8F9FC;
  font-family:var(--font);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

#app{
  width:calc(100% - 16px);
  max-width:220px;
  position:relative;
}

/* ════════════════════════════════
   CARD — matches suspense card exactly
════════════════════════════════ */
#card{
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:22px;
  border:1px solid rgba(255,255,255,.7);
  overflow:hidden;
  position:relative;
  box-shadow:
    0 2px 8px rgba(15,23,42,.06),
    0 10px 32px rgba(15,23,42,.08),
    inset 0 1px 0 rgba(255,255,255,.9);
  transition:
    box-shadow .3s var(--ease2),
    transform .25s var(--ease2);
  cursor:default;
  animation:cardIn .7s var(--ease2) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(18px) scale(.96)}
  to{opacity:1;transform:none}
}
#card:hover{
  box-shadow:
    0 4px 16px rgba(15,23,42,.1),
    0 24px 52px rgba(15,23,42,.13),
    inset 0 1px 0 rgba(255,255,255,.9);
  transform:translateY(-3px);
}
/* glass sheen */
#card::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,transparent 55%);
  border-radius:22px;pointer-events:none;z-index:0;
}

/* ── BODY ── */
.body{
  padding:16px 16px 14px;
  position:relative;z-index:1;
}

/* ── HEADER ── */
#card-hdr{
  font-size:8px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--t4);
  margin-bottom:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .2s;
}
#card:hover #card-hdr{color:var(--t3);}

/* ── AMOUNT BLOCK — hides on hover ── */
#amt-block{
  overflow:hidden;
  max-height:80px;
  opacity:1;
  transform:translateY(0);
  transition:
    max-height .35s var(--ease2),
    opacity .25s ease,
    transform .25s var(--ease2),
    margin .3s var(--ease2);
  margin-bottom:0;
}
#card:hover #amt-block{
  max-height:0;opacity:0;
  transform:translateY(-6px);
  margin-bottom:0;
}

#amount{
  font-family:var(--mono);
  font-size:28px;font-weight:700;
  color:var(--t1);
  letter-spacing:-.04em;line-height:1;
  margin-bottom:6px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  transition:transform .3s ease;
}
#card:hover #amount{transform:translateY(-2px);}

.meta-row{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  margin-bottom:2px;
}
#avg-lbl{
  font-size:8px;font-weight:600;
  color:var(--t3);white-space:nowrap;
}
#delta-chip{
  display:inline-flex;align-items:center;gap:3px;
  font-size:8px;font-weight:700;
  padding:3px 8px;border-radius:999px;
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.5);
  backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.04);
  transition:background .25s,color .25s;
}
#delta-chip.up{background:rgba(34,197,94,.12);color:#15803d;}
#delta-chip.dn{background:rgba(239,68,68,.12);color:#b91c1c;}
#delta-chip.neu{background:rgba(148,163,184,.1);color:var(--t3);}

/* ── DIVIDER — hides on hover ── */
#divider{
  height:0.5px;
  background:linear-gradient(90deg,rgba(15,23,42,.08) 0%,transparent 100%);
  margin:11px 0 10px;
  transition:margin .3s var(--ease2),opacity .2s,max-height .3s var(--ease2);
  max-height:1px;opacity:1;overflow:hidden;
}
#card:hover #divider{opacity:0;margin:0;max-height:0;}

/* ── CHART WRAP — glass inset, expands on hover ── */
#chart-wrap{
  position:relative;
  height:52px;
  border-radius:14px;
  overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(248,250,252,.2));
  border:1px solid rgba(255,255,255,.5);
  transition:height .38s var(--ease2),margin .3s var(--ease2);
  margin-top:0;
}
#card:hover #chart-wrap{height:80px;margin-top:8px;}
#chart-canvas{width:100%!important;height:100%!important;display:block;}

/* ── X-AXIS LABELS — appear on hover ── */
#x-labels{
  display:flex;justify-content:space-between;
  padding:5px 0 0;
  opacity:0;
  transition:opacity .25s ease .1s;
  pointer-events:none;
}
#card:hover #x-labels{opacity:1;}
#x-labels span{
  font-size:7px;font-weight:600;
  color:var(--t5);white-space:nowrap;
}

/* ── CHART VALUE BADGE ── */
#chart-tooltip{
  position:absolute;top:6px;right:7px;
  font-size:8px;font-weight:700;
  font-family:var(--mono);
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.6);
  padding:3px 7px;border-radius:8px;
  color:var(--t2);
  backdrop-filter:blur(10px);
  opacity:0;transition:opacity .2s;pointer-events:none;
  z-index:2;
}
#card:hover #chart-tooltip{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div id="card">
    <div class="body">
      <div id="card-hdr">KPI Metric</div>

      <div id="amt-block">
        <div id="amount">—</div>
        <div class="meta-row">
          <span id="avg-lbl">Avg —</span>
          <span id="delta-chip" class="neu">—</span>
        </div>
      </div>

      <div id="divider"></div>

      <div id="chart-wrap">
        <canvas id="chart-canvas"></canvas>
        <div id="chart-tooltip"></div>
      </div>
      <div id="x-labels"></div>
    </div>
  </div>
</div>

<script>
'use strict';
(function(){

var $=function(id){return document.getElementById(id);};
var appEl=$('app');
var chartObj=null;

/* ════════════════ NUMBER FORMAT ════════════════ */
function fmt(n){
  if(n===null||isNaN(n)) return '—';
  var abs=Math.abs(n),s=n<0?'-':'';
  if(abs>=1e9){
    var b=abs/1e9;
    return s+(b>=100?Math.round(b).toLocaleString('en-US'):parseFloat(b.toFixed(2)).toLocaleString('en-US'))+' Bn';
  }
  if(abs>=1e6){
    var m=abs/1e6;
    return s+(m>=100?Math.round(m).toLocaleString('en-US'):parseFloat(m.toFixed(2)).toLocaleString('en-US'))+' Mn';
  }
  if(abs>=1e3){
    var k=abs/1e3;
    return s+parseFloat(k.toFixed(1)).toLocaleString('en-US')+' K';
  }
  if(abs<100) return s+parseFloat(abs.toFixed(2)).toLocaleString('en-US');
  return s+Math.round(abs).toLocaleString('en-US');
}

/* ════════════════ RESPONSIVE ════════════════ */
function applyScale(w){
  var heroSz=Math.min(30,Math.max(17,Math.round((w/220)*28)));
  $('amount').style.fontSize=heroSz+'px';
}
if(window.ResizeObserver){
  new ResizeObserver(function(e){applyScale(e[0].contentRect.width);}).observe(appEl);
}
window.addEventListener('resize',function(){applyScale(appEl.offsetWidth||220);});

/* ════════════════ CHART ════════════════ */
function makeGradient(ctx,color){
  var g=ctx.createLinearGradient(0,0,0,160);
  g.addColorStop(0,color+'66');
  g.addColorStop(.4,color+'18');
  g.addColorStop(1,color+'00');
  return g;
}

function getColor(vals){
  if(!vals.length) return '#22c55e';
  return vals[vals.length-1]>=vals[0]?'#22c55e':vals[vals.length-1]<vals[0]?'#ef4444':'#3b82f6';
}

function buildChart(labels,values){
  var color=getColor(values);
  var ctx=$('chart-canvas').getContext('2d');
  var grad=makeGradient(ctx,color);

  var glowPlugin={
    id:'glow',
    beforeDatasetDraw:function(chart){
      var c=chart.ctx;c.save();
      c.shadowColor=color;c.shadowBlur=14;c.shadowOffsetY=4;
    },
    afterDatasetDraw:function(chart){chart.ctx.restore();}
  };

  if(chartObj){
    chartObj.data.labels=labels;
    chartObj.data.datasets[0].data=values;
    chartObj.data.datasets[0].borderColor=color;
    chartObj.data.datasets[0].backgroundColor=grad;
    chartObj.update('active');
    return;
  }

  chartObj=new Chart(ctx,{
    type:'line',
    data:{labels:labels,datasets:[{
      data:values,
      borderColor:color,
      borderWidth:3,
      pointRadius:0,
      pointHoverRadius:6,
      pointHoverBackgroundColor:color,
      pointHoverBorderColor:'#fff',
      pointHoverBorderWidth:3,
      tension:.42,
      fill:true,
      backgroundColor:grad
    }]},
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:2200,easing:'easeOutQuart'},
      animations:{y:{from:0,duration:1800,easing:'easeOutQuart'},x:{duration:1000}},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(10,15,26,.92)',
          titleColor:'#f1f5f9',bodyColor:'rgba(255,255,255,.75)',
          titleFont:{size:10,weight:'700',family:'Inter'},
          bodyFont:{size:9,family:'Inter'},
          padding:10,cornerRadius:9,
          callbacks:{
            title:function(i){return i[0].label;},
            label:function(i){return ' '+fmt(i.raw);}
          }
        }
      },
      interaction:{mode:'index',intersect:false},
      scales:{
        x:{display:false,grid:{display:false}},
        y:{display:false,min:0,grid:{display:false}}
      }
    },
    plugins:[glowPlugin]
  });
}

/* ════════════════ DATE HELPERS ════════════════ */
function parseDate(dv){
  if(!dv) return null;
  var nv=dv.nativeValue!==undefined?dv.nativeValue:dv.value;
  var fv=(dv.formattedValue||'').trim();
  if(typeof nv==='number'&&nv>1e10){var d=new Date(nv);if(d.getFullYear()>=1990&&d.getFullYear()<=2050) return d;}
  if(typeof nv==='number'&&nv>=1990&&nv<=2050) return new Date(nv,0,1);
  if(typeof nv==='number'&&nv>=1&&nv<=12) return new Date(2000,nv-1,1);
  if(fv){
    var iso=fv.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso) return new Date(+iso[1],+iso[2]-1,+iso[3]);
    var d2=new Date(fv);
    if(!isNaN(d2.getTime())&&d2.getFullYear()>=1990) return d2;
  }
  return null;
}
function fmtLabel(dv){
  if(!dv) return '';
  var fv=(dv.formattedValue||'').trim();
  if(fv&&fv!=='%null%'&&fv!=='Null') return fv;
  var nv=dv.nativeValue;
  if(typeof nv==='number'&&nv>=1990&&nv<=2050) return String(nv);
  if(typeof nv==='number'&&nv>=1&&nv<=12){
    var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return M[nv-1];
  }
  if(typeof nv==='number'&&nv>1e10){
    var d=new Date(nv);
    var M2=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate()+' '+M2[d.getMonth()];
  }
  return String(nv||'');
}

/* ════════════════ RENDER ════════════════ */
function render(rows,enc){
  if(!rows.length) return;
  var rowKeys=Object.keys(rows[0]);

  function findKey(ef){
    if(!ef) return null;
    var nm=ef.name.toLowerCase();
    for(var i=0;i<rowKeys.length;i++) if(rowKeys[i].toLowerCase()===nm) return rowKeys[i];
    return null;
  }
  function autoDateKey(){
    var cands=['date','month','day','year','period','posting'];
    for(var ci=0;ci<cands.length;ci++)
      for(var ki=0;ki<rowKeys.length;ki++)
        if(rowKeys[ki].toLowerCase().indexOf(cands[ci])>=0) return rowKeys[ki];
    return null;
  }

  var hdrKey    =findKey(enc.header);
  var displayKey=findKey(enc.display);
  var trendKey  =findKey(enc.trend);
  var dateKey   =findKey(enc.date)||autoDateKey();

  function dvStr(row,k){
    if(!k||!row[k]) return null;
    var f=row[k].formattedValue;
    return(f&&f!=='%null%'&&f!=='Null'&&f.trim()!=='')?f.trim():null;
  }
  function dvNum(row,k){
    if(!k||!row[k]) return null;
    var dv=row[k];
    var raw=dv.nativeValue!==undefined&&dv.nativeValue!==null?dv.nativeValue:dv.value;
    var n=parseFloat(raw);return isNaN(n)?null:n;
  }

  /* header */
  var hdrTxt=dvStr(rows[0],hdrKey);
  if(!hdrTxt){
    var fn=enc[displayKey?'display':'trend'];
    hdrTxt=fn?fn.name.replace(/^(SUM|AVG|MAX|MIN)\((.+)\)$/i,'$2').trim():null;
  }
  $('card-hdr').textContent=(hdrTxt||'KPI Metric').toUpperCase();

  /* display amount — SUM all rows independently of date */
  var displayVal=null;
  if(displayKey){
    var _s=0,_c=0;
    rows.forEach(function(row){
      if(!row[displayKey]) return;
      var dv=row[displayKey];
      var raw=dv.nativeValue!==undefined&&dv.nativeValue!==null?dv.nativeValue:dv.value;
      var n=parseFloat(raw);
      if(!isNaN(n)){_s+=n;_c++;}
    });
    if(_c>0) displayVal=_s;
  }

  /* trend series */
  var tKey=trendKey||displayKey;
  var pts=[];
  rows.forEach(function(row){
    var val=dvNum(row,tKey);if(val===null) return;
    var lbl=dateKey?fmtLabel(row[dateKey]):'';
    var dateObj=dateKey?parseDate(row[dateKey]):null;
    pts.push({val:val,lbl:lbl,date:dateObj});
  });
  if(pts.length&&pts[0].date)
    pts.sort(function(a,b){return(a.date?a.date.getTime():0)-(b.date?b.date.getTime():0);});
  var seen={},unique=[];
  pts.forEach(function(p){if(!seen[p.lbl]){seen[p.lbl]=true;unique.push(p);}});
  pts=unique;

  if(!pts.length&&displayVal===null) return;

  var tVals=pts.map(function(p){return p.val;});
  var labels=pts.map(function(p){return p.lbl;});

  /* hero */
  var heroVal=(displayVal!==null)?displayVal:tVals.length?tVals[tVals.length-1]:null;
  if(heroVal===null) return;
  $('amount').textContent=fmt(heroVal);

  /* avg + variance */
  if(tVals.length){
    var avg=tVals.reduce(function(s,v){return s+v;},0)/tVals.length;
    $('avg-lbl').textContent='Avg '+fmt(avg);
    var delta=avg!==0?((heroVal-avg)/Math.abs(avg))*100:null;
    var chip=$('delta-chip');
    if(delta!==null){
      var up=delta>=0;
      chip.className=up?'up':'dn';
      chip.textContent=(up?'▲ ':' ▼ ')+(delta>=0?'+':'')+Math.abs(delta).toFixed(1)+'% vs avg';
    } else {chip.className='neu';chip.textContent='—';}
  } else {
    $('avg-lbl').textContent='';
    $('delta-chip').className='neu';$('delta-chip').textContent='';
  }

  /* chart */
  if(tVals.length){
    buildChart(labels,tVals);
    var xl=$('x-labels');xl.innerHTML='';
    var s1=document.createElement('span');s1.textContent=labels[0]||'';xl.appendChild(s1);
    if(labels.length>1){var s2=document.createElement('span');s2.textContent=labels[labels.length-1]||'';xl.appendChild(s2);}
    $('chart-tooltip').textContent=fmt(heroVal);
  }

  applyScale(appEl.offsetWidth||220);
}

/* ════════════════ DATA READER ════════════════ */
async function getData(ws){
  var rows=[],rdr=await ws.getSummaryDataReaderAsync(undefined,{ignoreSelection:true});
  for(var i=0;i<rdr.pageCount;i++){
    var pg=await rdr.getPageAsync(i);
    pg.data.forEach(function(r){
      var row={};pg.columns.forEach(function(c,idx){row[c.fieldName]=r[idx];});rows.push(row);
    });
  }
  await rdr.releaseAsync();return rows;
}
async function getEnc(ws){
  var spec=await ws.getVisualSpecificationAsync(),map={};
  if(spec.activeMarksSpecificationIndex<0) return map;
  spec.marksSpecifications[spec.activeMarksSpecificationIndex]
      .encodings.forEach(function(e){map[e.id]=e.field;});
  return map;
}

/* ════════════════ INIT ════════════════ */
window.onload=tableau.extensions.initializeAsync().then(function(){
  var ws=tableau.extensions.worksheetContent.worksheet;
  var update=async function(){
    var data=await getData(ws);var enc=await getEnc(ws);render(data,enc);
  };
  ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,update);
  update();
});

})();
</script>
</body>
</html>
